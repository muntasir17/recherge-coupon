<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch Card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- <link href="./output.css" rel="stylesheet"> -->
     <script src="https://cdn.tailwindcss.com"></script>
</head>
<!-- npx @tailwindcss/cli -i ./src/input.css -o ./src/output.css --watch -->
<body class="bg-slate-50 text-slate-800 antialiased py-8 px-4 sm:px-6 lg:px-8 flex justify-center items-center">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        body {
            font-family: "Poppins", sans-serif;
        }

    </style>
<br>

<div class="max-w-sm w-full bg-white rounded-3xl shadow-xl p-6 border border-slate-200 text-center space-y-6">
    <div>
      <span class="inline-block px-3 py-1 bg-red-100 text-red-600 rounded-full text-xs font-semibold uppercase tracking-wider mb-2">
        Recharge Voucher
      </span>
      <h2 class="text-2xl font-bold text-slate-800">Scratch & Recharge</h2>
      <p class="text-xs text-slate-500 mt-1">Scratch the silver box below to reveal your 12-digit PIN code.</p>
    </div>
    <div class="relative w-full h-24 bg-gradient-to-r from-red-500 to-rose-600 rounded-2xl flex items-center justify-center shadow-inner overflow-hidden select-none">
      <span id="secretPin" class="num text-2xl font-mono font-bold tracking-widest text-white select-none">
        4829 1058 3920
      </span>
      <canvas id="scratchCanvas" class="absolute top-0 left-0 w-full h-full cursor-pointer rounded-2xl"></canvas>
    </div>
    <div class="space-y-3 pt-2">
      <label for="pinInput" class="block text-xs font-semibold text-slate-600 text-left">
        Enter 12-Digit PIN:
      </label>
      
  <div class="flex gap-2">
  <input type="number" id="pinInput" placeholder="Enter PIN number" class="inpFiels flex-1 h-12 border border-slate-300 rounded-xl px-4 outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent text-slate-800 transition text-sm font-mono">
<button id="submitBtn" class="btn bg-red-500 hover:bg-red-600 active:scale-95 text-white font-medium rounded-xl px-5 h-12 text-base cursor-pointer transition shadow-md shadow-red-200"> Send</button>
      </div>
    </div>
    <div class="pt-1 min-h-[48px] flex flex-col justify-center">
      <h1 class="res text-center text-base font-bold transition-all"></h1>
    </div>

  </div>

</body>

</html>
